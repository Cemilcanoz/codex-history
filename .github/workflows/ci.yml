name: Build & tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore CodexHistory.sln
      - name: Build
        run: dotnet build CodexHistory.sln --configuration Release --no-restore
      - name: Test synthetic fixtures
        run: dotnet test CodexHistory.sln --configuration Release --no-build
